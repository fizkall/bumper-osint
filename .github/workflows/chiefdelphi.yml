name: Chief Delphi verisini güncelle
on:
  schedule:
    - cron: '0 3 * * *'   # her gün 03:00 UTC
  workflow_dispatch:       # elle çalıştırma düğmesi
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node fetch_cd.mjs
      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add chiefdelphi.json
          git diff --staged --quiet || (git commit -m "Chief Delphi verisi güncellendi" && git push)
